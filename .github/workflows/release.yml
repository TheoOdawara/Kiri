name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-15
            source: target/release/kiri
            asset: kiri-macos-aarch64
          - os: macos-15-intel
            source: target/release/kiri
            asset: kiri-macos-x86_64
          - os: ubuntu-22.04
            source: target/release/kiri
            asset: kiri-linux-x86_64
          - os: windows-2025
            source: target/release/kiri.exe
            asset: kiri-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup default stable
      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Verify Linux sandbox boundary
        if: runner.os == 'Linux'
        run: |
          roots=()
          for root in /usr /bin /sbin /lib /lib64 /etc; do
            if [[ -e "$root" ]]; then
              roots+=(--ro-bind "$(readlink -f "$root")" "$root")
            fi
          done
          /usr/bin/bwrap "${roots[@]}" --dev /dev --proc /proc --tmpfs /tmp \
            --unshare-net --unshare-pid --unshare-ipc --new-session --cap-drop ALL \
            --die-with-parent -- /usr/bin/true
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - name: Stage asset
        shell: pwsh
        run: Copy-Item -LiteralPath '${{ matrix.source }}' -Destination '${{ matrix.asset }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Verify tag matches manifests
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw 'Release tag must be v followed by a semantic version'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $cargo = Select-String -Path Cargo.toml -Pattern '^version = "([^\"]+)"$' | Select-Object -First 1
          $npm = (Get-Content packages/npm/package.json -Raw | ConvertFrom-Json).version
          if (-not $cargo -or $cargo.Matches[0].Groups[1].Value -ne $version -or $npm -ne $version) {
            throw "Tag, Cargo.toml, and npm package versions must match"
          }
      - name: Package release files
        shell: pwsh
        run: |
          Copy-Item packages/npm/install-windows.ps1 dist/install-windows.ps1
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS -Encoding ascii
          npm pack ./packages/npm --pack-destination dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
      - name: Publish npm package
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/*.tgz --access public --ignore-scripts
