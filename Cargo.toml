[workspace]
resolver = "3"
members = ["crates/kiri-core", "crates/kiri-tui", "crates/kiri", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
kiri-core = { path = "crates/kiri-core" }
kiri-tui = { path = "crates/kiri-tui" }
agent-client-protocol-schema = { version = "=1.13.0", default-features = false }
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
eventsource-stream = "=0.2.3"
futures-util = "=0.3.34"
libc = "=0.2.191"
reqwest = { version = "=0.13.5", default-features = false, features = ["http2", "rustls", "stream", "system-proxy"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
windows-sys = "=0.61.2"
